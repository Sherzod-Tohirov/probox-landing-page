<svg width="500" height="320" viewBox="0 0 500 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="posBg" x1="0" y1="0" x2="500" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8ddd3"/>
      <stop offset="100%" stop-color="#d4c4b0"/>
    </linearGradient>
    <linearGradient id="handSkin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#c49464"/>
    </linearGradient>
    <linearGradient id="posBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a4a"/>
      <stop offset="100%" stop-color="#1a1a2a"/>
    </linearGradient>
    <clipPath id="posClip">
      <rect width="500" height="320" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#posClip)">
    <!-- Background -->
    <rect width="500" height="320" fill="url(#posBg)"/>

    <!-- Table/counter surface -->
    <rect x="0" y="200" width="500" height="120" fill="#b8a896"/>
    <rect x="0" y="198" width="500" height="4" fill="#a89886" opacity="0.5"/>

    <!-- POS Terminal body -->
    <rect x="260" y="60" width="140" height="200" rx="12" fill="url(#posBody)"/>
    <!-- Terminal screen -->
    <rect x="272" y="74" width="116" height="80" rx="6" fill="#0a0a12"/>
    <!-- Screen content -->
    <rect x="284" y="86" width="92" height="8" rx="4" fill="#22c55e"/>
    <text x="330" y="93" text-anchor="middle" font-family="monospace" font-size="7" fill="#22c55e">1 000 000 UZS</text>
    <rect x="284" y="102" width="60" height="6" rx="3" fill="#334155"/>
    <rect x="284" y="114" width="72" height="6" rx="3" fill="#334155"/>
    <rect x="284" y="126" width="48" height="6" rx="3" fill="#22c55e" opacity="0.6"/>

    <!-- Keypad -->
    <g>
      <rect x="278" y="164" width="24" height="16" rx="3" fill="#4a4a5a"/>
      <rect x="308" y="164" width="24" height="16" rx="3" fill="#4a4a5a"/>
      <rect x="338" y="164" width="24" height="16" rx="3" fill="#4a4a5a"/>
      <rect x="368" y="164" width="24" height="16" rx="3" fill="#22c55e"/>
      <rect x="278" y="186" width="24" height="16" rx="3" fill="#4a4a5a"/>
      <rect x="308" y="186" width="24" height="16" rx="3" fill="#4a4a5a"/>
      <rect x="338" y="186" width="24" height="16" rx="3" fill="#4a4a5a"/>
      <rect x="368" y="186" width="24" height="16" rx="3" fill="#ef4444"/>
      <rect x="278" y="208" width="24" height="16" rx="3" fill="#4a4a5a"/>
      <rect x="308" y="208" width="24" height="16" rx="3" fill="#4a4a5a"/>
      <rect x="338" y="208" width="24" height="16" rx="3" fill="#4a4a5a"/>
      <rect x="368" y="208" width="24" height="16" rx="3" fill="#f59e0b"/>
    </g>

    <!-- NFC reader glow -->
    <circle cx="330" cy="240" r="18" fill="#3b82f6" opacity="0.15"/>
    <circle cx="330" cy="240" r="12" fill="#3b82f6" opacity="0.1"/>

    <!-- Card being tapped (credit card) -->
    <g transform="rotate(-15, 200, 180)">
      <rect x="110" y="150" width="140" height="88" rx="8" fill="#1a56db"/>
      <rect x="110" y="150" width="140" height="88" rx="8" fill="url(#cardGrad)" opacity="0.8"/>
      <!-- Card chip -->
      <rect x="128" y="172" width="28" height="22" rx="4" fill="#fbbf24"/>
      <rect x="132" y="176" width="20" height="14" rx="2" fill="#f59e0b"/>
      <!-- Card lines -->
      <rect x="128" y="210" width="80" height="6" rx="3" fill="rgba(255,255,255,0.3)"/>
      <rect x="128" y="222" width="50" height="5" rx="2.5" fill="rgba(255,255,255,0.2)"/>
      <!-- Contactless symbol on card -->
      <g transform="translate(212, 166)">
        <path d="M4 8 A6 6 0 0 1 4 0" stroke="white" stroke-width="1.5" fill="none" opacity="0.6"/>
        <path d="M7 10 A10 10 0 0 1 7 -2" stroke="white" stroke-width="1.5" fill="none" opacity="0.4"/>
        <path d="M10 12 A14 14 0 0 1 10 -4" stroke="white" stroke-width="1.5" fill="none" opacity="0.2"/>
      </g>
    </g>

    <!-- Hand holding card -->
    <g>
      <!-- Forearm -->
      <path d="M 0 240 Q 40 200, 100 180 Q 130 170, 155 165 L 165 180 Q 130 190, 100 200 Q 50 220, 0 260 Z" fill="url(#handSkin)"/>
      <!-- Thumb -->
      <path d="M 140 165 Q 152 158, 160 160 Q 168 162, 165 175 Q 155 175, 140 172 Z" fill="url(#handSkin)"/>
      <!-- Fingers -->
      <path d="M 150 178 Q 170 174, 178 180 L 175 194 Q 162 190, 148 188 Z" fill="#c49464"/>
    </g>

    <!-- Wireless payment waves -->
    <g opacity="0.6">
      <circle cx="260" cy="200" r="8" stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.4"/>
      <circle cx="260" cy="200" r="14" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.3"/>
      <circle cx="260" cy="200" r="20" stroke="#3b82f6" stroke-width="0.8" fill="none" opacity="0.2"/>
    </g>
  </g>

  <defs>
    <linearGradient id="cardGrad" x1="110" y1="150" x2="250" y2="238" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
</svg>