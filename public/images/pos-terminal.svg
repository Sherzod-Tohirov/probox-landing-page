<svg width="400" height="220" viewBox="0 0 400 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="220" fill="#e2e8f0"/>
  <!-- Background gradient -->
  <rect width="400" height="220" fill="url(#bgGrad)"/>
  <!-- Person silhouette -->
  <ellipse cx="160" cy="80" rx="30" ry="30" fill="#94a3b8"/>
  <rect x="120" y="110" width="80" height="90" rx="12" fill="#94a3b8"/>
  <!-- POS terminal -->
  <rect x="210" y="80" width="110" height="80" rx="8" fill="#475569"/>
  <rect x="218" y="88" width="94" height="52" rx="4" fill="#1e293b"/>
  <rect x="226" y="96" width="78" height="36" rx="3" fill="#0f172a"/>
  <!-- Screen text on POS -->
  <rect x="234" y="104" width="62" height="6" rx="3" fill="#22c55e"/>
  <rect x="234" y="114" width="40" height="4" rx="2" fill="#64748b"/>
  <!-- POS keypad -->
  <rect x="218" y="148" width="14" height="8" rx="2" fill="#64748b"/>
  <rect x="236" y="148" width="14" height="8" rx="2" fill="#64748b"/>
  <rect x="254" y="148" width="14" height="8" rx="2" fill="#64748b"/>
  <rect x="272" y="148" width="14" height="8" rx="2" fill="#22c55e"/>
  <!-- Hand reaching -->
  <ellipse cx="175" cy="148" rx="18" ry="10" fill="#b0947a"/>
  <rect x="162" y="138" width="30" height="16" rx="8" fill="#b0947a"/>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="400" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
