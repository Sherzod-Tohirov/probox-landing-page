<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="transparent"/>

  <!-- Decorative sparkle dots (like in design) -->
  <circle cx="320" cy="260" r="3" fill="#3b82f6" opacity="0.3"/>
  <circle cx="340" cy="250" r="2" fill="#6366f1" opacity="0.4"/>
  <circle cx="360" cy="270" r="4" fill="#3b82f6" opacity="0.2"/>
  <circle cx="280" cy="280" r="2.5" fill="#8b5cf6" opacity="0.3"/>
  <circle cx="370" cy="240" r="2" fill="#3b82f6" opacity="0.5"/>
  <circle cx="390" cy="260" r="3" fill="#6366f1" opacity="0.3"/>
  <circle cx="350" cy="285" r="2" fill="#3b82f6" opacity="0.4"/>

  <!-- Back large gift box (dark blue) -->
  <rect x="220" y="100" width="130" height="120" rx="4" fill="#1e3a8a"/>
  <rect x="220" y="100" width="130" height="30" rx="4" fill="#1d4ed8"/>
  <!-- Ribbon vertical on back box -->
  <rect x="278" y="100" width="14" height="120" fill="#f59e0b" opacity="0.8"/>
  <!-- Bow on back box -->
  <ellipse cx="275" cy="100" rx="22" ry="12" fill="#f59e0b" opacity="0.7"/>
  <ellipse cx="297" cy="100" rx="22" ry="12" fill="#f59e0b" opacity="0.7"/>
  <circle cx="285" cy="100" r="8" fill="#f59e0b"/>

  <!-- Gold shimmer on back box -->
  <rect x="225" y="140" width="120" height="4" rx="2" fill="#3b82f6" opacity="0.3"/>
  <rect x="225" y="150" width="100" height="4" rx="2" fill="#3b82f6" opacity="0.2"/>

  <!-- Small gift box left -->
  <rect x="90" y="160" width="90" height="85" rx="4" fill="#1e40af"/>
  <rect x="90" y="160" width="90" height="22" rx="4" fill="#2563eb"/>
  <!-- Ribbon vertical on small box -->
  <rect x="131" y="160" width="8" height="85" fill="#fbbf24" opacity="0.8"/>
  <!-- Bow on small box -->
  <ellipse cx="129" cy="160" rx="16" ry="9" fill="#fbbf24" opacity="0.7"/>
  <ellipse cx="143" cy="160" rx="16" ry="9" fill="#fbbf24" opacity="0.7"/>
  <circle cx="135" cy="160" r="6" fill="#fbbf24"/>

  <!-- Medium gift box center-right (tall) -->
  <rect x="170" y="120" width="110" height="130" rx="4" fill="#1e3a8a"/>
  <rect x="170" y="120" width="110" height="28" rx="4" fill="#1d4ed8"/>
  <!-- Ribbon vertical on medium box -->
  <rect x="220" y="120" width="10" height="130" fill="#f59e0b" opacity="0.8"/>
  <!-- Bow on medium box -->
  <ellipse cx="218" cy="120" rx="18" ry="10" fill="#f59e0b" opacity="0.7"/>
  <ellipse cx="234" cy="120" rx="18" ry="10" fill="#f59e0b" opacity="0.7"/>
  <circle cx="225" cy="120" r="7" fill="#f59e0b"/>

  <!-- Star/sparkle decorations -->
  <text x="60" y="200" font-size="20" fill="#fbbf24" opacity="0.6">✦</text>
  <text x="370" y="180" font-size="16" fill="#60a5fa" opacity="0.5">✦</text>
  <text x="50" y="250" font-size="12" fill="#a78bfa" opacity="0.4">★</text>
  <text x="380" y="130" font-size="14" fill="#fbbf24" opacity="0.4">✦</text>
</svg>
