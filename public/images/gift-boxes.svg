<svg width="480" height="360" viewBox="0 0 480 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="box1Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="box2Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="box3Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="ribbonV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="lidGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="lidGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="giftShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
    <filter id="giftShadowSmall">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background gift box (large, back right) -->
  <g filter="url(#giftShadow)" transform="translate(240, 50)">
    <!-- Box body -->
    <rect x="0" y="36" width="180" height="160" rx="6" fill="url(#box1Grad)"/>
    <!-- Sheen -->
    <rect x="0" y="36" width="8" height="160" rx="4" fill="rgba(255,255,255,0.06)"/>
    <!-- Lid -->
    <rect x="-6" y="0" width="192" height="42" rx="6" fill="url(#lidGrad1)"/>
    <!-- Ribbon horizontal -->
    <rect x="-6" y="14" width="192" height="14" fill="url(#ribbon)" opacity="0.85"/>
    <!-- Ribbon vertical -->
    <rect x="82" y="0" width="16" height="196" fill="url(#ribbonV)" opacity="0.85"/>
    <!-- Bow -->
    <ellipse cx="82" cy="10" rx="28" ry="14" fill="#f59e0b"/>
    <ellipse cx="106" cy="10" rx="28" ry="14" fill="#fbbf24"/>
    <ellipse cx="94" cy="10" rx="10" ry="8" fill="#d97706"/>
    <!-- Ribbon tails -->
    <path d="M70 10 Q55 -5, 50 -15 L56 -12 Q60 -4, 72 8 Z" fill="#f59e0b" opacity="0.8"/>
    <path d="M118 10 Q133 -5, 138 -15 L132 -12 Q128 -4, 116 8 Z" fill="#fbbf24" opacity="0.8"/>
    <!-- Box highlight -->
    <rect x="10" y="60" width="70" height="3" rx="1.5" fill="rgba(255,255,255,0.05)"/>
    <rect x="10" y="100" width="50" height="2" rx="1" fill="rgba(255,255,255,0.03)"/>
  </g>

  <!-- Medium gift box (center) -->
  <g filter="url(#giftShadow)" transform="translate(140, 80)">
    <rect x="0" y="32" width="150" height="175" rx="6" fill="url(#box2Grad)"/>
    <rect x="0" y="32" width="7" height="175" rx="3.5" fill="rgba(255,255,255,0.06)"/>
    <rect x="-5" y="0" width="160" height="38" rx="6" fill="url(#lidGrad2)"/>
    <!-- Ribbon horizontal -->
    <rect x="-5" y="12" width="160" height="14" fill="url(#ribbon)" opacity="0.85"/>
    <!-- Ribbon vertical -->
    <rect x="67" y="0" width="16" height="207" fill="url(#ribbonV)" opacity="0.85"/>
    <!-- Bow -->
    <ellipse cx="67" cy="8" rx="24" ry="12" fill="#f59e0b"/>
    <ellipse cx="89" cy="8" rx="24" ry="12" fill="#fbbf24"/>
    <ellipse cx="78" cy="8" rx="8" ry="7" fill="#d97706"/>
    <path d="M57 8 Q44 -4, 40 -12 L45 -9 Q48 -2, 59 6 Z" fill="#f59e0b" opacity="0.8"/>
    <path d="M99 8 Q112 -4, 116 -12 L111 -9 Q108 -2, 97 6 Z" fill="#fbbf24" opacity="0.8"/>
  </g>

  <!-- Small gift box (front left) -->
  <g filter="url(#giftShadowSmall)" transform="translate(50, 150)">
    <rect x="0" y="28" width="120" height="120" rx="5" fill="url(#box3Grad)"/>
    <rect x="0" y="28" width="6" height="120" rx="3" fill="rgba(255,255,255,0.06)"/>
    <rect x="-4" y="0" width="128" height="34" rx="5" fill="url(#lidGrad2)"/>
    <!-- Ribbon horizontal -->
    <rect x="-4" y="10" width="128" height="12" fill="url(#ribbon)" opacity="0.85"/>
    <!-- Ribbon vertical -->
    <rect x="54" y="0" width="12" height="148" fill="url(#ribbonV)" opacity="0.85"/>
    <!-- Bow -->
    <ellipse cx="54" cy="6" rx="20" ry="10" fill="#f59e0b"/>
    <ellipse cx="72" cy="6" rx="20" ry="10" fill="#fbbf24"/>
    <ellipse cx="63" cy="6" rx="7" ry="6" fill="#d97706"/>
    <path d="M45 6 Q35 -3, 32 -10 L36 -7 Q39 -1, 47 5 Z" fill="#f59e0b" opacity="0.8"/>
    <path d="M81 6 Q91 -3, 94 -10 L90 -7 Q87 -1, 79 5 Z" fill="#fbbf24" opacity="0.8"/>
  </g>

  <!-- Decorative sparkles -->
  <circle cx="440" cy="80" r="3" fill="#fbbf24" opacity="0.5"/>
  <circle cx="460" cy="120" r="2" fill="#3b82f6" opacity="0.4"/>
  <circle cx="30" cy="100" r="2.5" fill="#fbbf24" opacity="0.4"/>
  <circle cx="420" cy="300" r="2" fill="#60a5fa" opacity="0.3"/>
  <circle cx="20" cy="250" r="3" fill="#fbbf24" opacity="0.3"/>
  <circle cx="470" cy="200" r="2.5" fill="#a78bfa" opacity="0.3"/>

  <!-- Star sparkles -->
  <path d="M450 60 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" fill="#fbbf24" opacity="0.5"/>
  <path d="M40 300 l1.5 4.5 4.5 1.5 -4.5 1.5 -1.5 4.5 -1.5 -4.5 -4.5 -1.5 4.5 -1.5z" fill="#60a5fa" opacity="0.4"/>
  <path d="M460 270 l1 3 3 1 -3 1 -1 3 -1 -3 -3 -1 3 -1z" fill="#fbbf24" opacity="0.4"/>
</svg>