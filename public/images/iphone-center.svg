<svg width="500" height="380" viewBox="0 0 500 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="phone1Body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="phone2Body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Phone 2 (back, slightly behind and rotated) -->
  <g transform="translate(280, 20) rotate(5)" filter="url(#softShadow)">
    <rect x="0" y="0" width="160" height="320" rx="28" fill="url(#phone2Body)"/>
    <!-- Side highlight -->
    <rect x="0" y="0" width="8" height="320" rx="4" fill="rgba(255,255,255,0.2)"/>
    <!-- Camera module -->
    <rect x="14" y="14" width="64" height="64" rx="16" fill="rgba(0,0,0,0.15)"/>
    <circle cx="34" cy="34" r="12" fill="#1a1a2e" stroke="#333" stroke-width="2"/>
    <circle cx="34" cy="34" r="6" fill="#0a0a1a"/>
    <circle cx="34" cy="34" r="3" fill="#1e3a5f"/>
    <circle cx="58" cy="34" r="12" fill="#1a1a2e" stroke="#333" stroke-width="2"/>
    <circle cx="58" cy="34" r="6" fill="#0a0a1a"/>
    <circle cx="58" cy="34" r="3" fill="#1e3a5f"/>
    <circle cx="46" cy="58" r="12" fill="#1a1a2e" stroke="#333" stroke-width="2"/>
    <circle cx="46" cy="58" r="6" fill="#0a0a1a"/>
    <circle cx="46" cy="58" r="3" fill="#1e3a5f"/>
    <!-- Flash -->
    <circle cx="68" cy="58" r="4" fill="#fbbf24" opacity="0.6"/>
    <!-- Apple logo area -->
    <circle cx="80" cy="160" r="12" fill="rgba(255,255,255,0.08)"/>
    <!-- Bottom text -->
    <text x="80" y="296" text-anchor="middle" font-family="Arial" font-size="8" fill="rgba(255,255,255,0.15)" letter-spacing="2">iPhone</text>
  </g>

  <!-- Phone 1 (front, in foreground) -->
  <g transform="translate(60, 30)" filter="url(#softShadow)">
    <rect x="0" y="0" width="160" height="320" rx="28" fill="url(#phone1Body)"/>
    <!-- Screen -->
    <rect x="8" y="12" width="144" height="296" rx="22" fill="url(#screenBg)"/>
    <!-- Dynamic Island -->
    <rect x="46" y="20" width="68" height="22" rx="11" fill="#000"/>
    <circle cx="70" cy="31" r="4" fill="#111827"/>
    <circle cx="90" cy="31" r="3.5" fill="#111827"/>

    <!-- Screen content - Lock screen -->
    <text x="80" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#fff">9:41</text>
    <text x="80" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">Dushanba, 7 aprel</text>

    <!-- Notification cards -->
    <rect x="18" y="110" width="124" height="48" rx="12" fill="rgba(255,255,255,0.08)"/>
    <circle cx="34" cy="126" r="8" fill="#3b82f6"/>
    <rect x="48" y="120" width="60" height="5" rx="2.5" fill="rgba(255,255,255,0.3)"/>
    <rect x="48" y="130" width="84" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="48" y="138" width="70" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>

    <rect x="18" y="166" width="124" height="48" rx="12" fill="rgba(255,255,255,0.08)"/>
    <circle cx="34" cy="182" r="8" fill="#22c55e"/>
    <rect x="48" y="176" width="50" height="5" rx="2.5" fill="rgba(255,255,255,0.3)"/>
    <rect x="48" y="186" width="84" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="48" y="194" width="60" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>

    <!-- Bottom controls -->
    <circle cx="40" cy="280" r="16" fill="rgba(255,255,255,0.08)"/>
    <circle cx="120" cy="280" r="16" fill="rgba(255,255,255,0.08)"/>
    <!-- Flashlight icon -->
    <rect x="36" y="272" width="8" height="12" rx="2" fill="rgba(255,255,255,0.5)"/>
    <rect x="37" y="270" width="6" height="4" rx="1" fill="rgba(255,255,255,0.5)"/>
    <!-- Camera icon -->
    <rect x="114" y="274" width="12" height="10" rx="2" fill="rgba(255,255,255,0.5)"/>
    <circle cx="120" cy="279" r="3" fill="rgba(255,255,255,0.3)"/>

    <!-- Home indicator -->
    <rect x="50" y="302" width="60" height="4" rx="2" fill="rgba(255,255,255,0.4)"/>
  </g>
</svg>