<svg width="320" height="400" viewBox="0 0 320 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iphoneBody" x1="40" y1="0" x2="280" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4845F"/>
      <stop offset="30%" stop-color="#E8734E"/>
      <stop offset="60%" stop-color="#E06840"/>
      <stop offset="100%" stop-color="#D45A32"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="54" y1="30" x2="266" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="cameraLens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a3e"/>
      <stop offset="100%" stop-color="#1a1a2a"/>
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="sideHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g filter="url(#phoneShadow)">
    <!-- iPhone body -->
    <rect x="34" y="10" width="252" height="380" rx="40" fill="url(#iphoneBody)"/>

    <!-- Side highlight -->
    <rect x="34" y="10" width="12" height="380" rx="6" fill="url(#sideHighlight)"/>

    <!-- Screen -->
    <rect x="46" y="26" width="228" height="348" rx="32" fill="url(#screenGrad)"/>

    <!-- Dynamic Island -->
    <rect x="120" y="38" width="80" height="26" rx="13" fill="#000000"/>
    <circle cx="145" cy="51" r="5" fill="#1a1a2e"/>
    <circle cx="175" cy="51" r="4" fill="#1a1a2e"/>

    <!-- Screen content - time -->
    <text x="160" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff">9:41</text>

    <!-- Screen content - date -->
    <text x="160" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888">Dushanba, 7 aprel</text>

    <!-- App icons row 1 -->
    <rect x="72" y="145" width="44" height="44" rx="10" fill="#34C759"/>
    <rect x="128" y="145" width="44" height="44" rx="10" fill="#007AFF"/>
    <rect x="184" y="145" width="44" height="44" rx="10" fill="#FF9500"/>
    <rect x="240" y="145" width="0" height="0" rx="0" fill="none"/>

    <!-- App icons row 2 -->
    <rect x="72" y="205" width="44" height="44" rx="10" fill="#FF3B30"/>
    <rect x="128" y="205" width="44" height="44" rx="10" fill="#5856D6"/>
    <rect x="184" y="205" width="44" height="44" rx="10" fill="#FF2D55"/>

    <!-- App icons row 3 -->
    <rect x="72" y="265" width="44" height="44" rx="10" fill="#AF52DE"/>
    <rect x="128" y="265" width="44" height="44" rx="10" fill="#00C7BE"/>
    <rect x="184" y="265" width="44" height="44" rx="10" fill="#FFD60A"/>

    <!-- Bottom dock -->
    <rect x="58" y="328" width="204" height="38" rx="19" fill="rgba(255,255,255,0.1)"/>
    <rect x="80" y="336" width="36" height="22" rx="6" fill="#34C759"/>
    <rect x="124" y="336" width="36" height="22" rx="6" fill="#007AFF"/>
    <rect x="168" y="336" width="36" height="22" rx="6" fill="#FF9500"/>
    <rect x="212" y="336" width="36" height="22" rx="6" fill="#FF3B30"/>

    <!-- Home indicator -->
    <rect x="126" y="374" width="68" height="4" rx="2" fill="rgba(255,255,255,0.5)"/>
  </g>

  <!-- Side buttons -->
  <rect x="30" y="110" width="5" height="32" rx="2.5" fill="#D45A32"/>
  <rect x="30" y="155" width="5" height="48" rx="2.5" fill="#D45A32"/>
  <rect x="285" y="140" width="5" height="56" rx="2.5" fill="#D45A32"/>

  <!-- Camera module (back visible slightly) -->
  <rect x="56" y="32" width="56" height="56" rx="14" fill="rgba(0,0,0,0.15)"/>
  <circle cx="72" cy="48" r="8" fill="url(#cameraLens)" opacity="0.3"/>
  <circle cx="96" cy="48" r="8" fill="url(#cameraLens)" opacity="0.3"/>
  <circle cx="84" cy="72" r="8" fill="url(#cameraLens)" opacity="0.3"/>
</svg>